version: "3.9"

services:
  torsora-logo-studio:
    build: .
    container_name: torsora-logo-studio
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASS=${AUTH_PASS:-changeme}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health > /dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
